name: Deploy a GitHub Pages

# En cada push a main: pruebas, compilación web y publicación.
# Sin los secretos de Supabase la app corre en modo demo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Compilar la web
        # El repositorio se llama DoggoTech/Doggo: la app vive en /Doggo/.
        run: >
          flutter build web --release --base-href /Doggo/
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Versionar los archivos (evita ver la versión vieja)
        # GitHub Pages deja los archivos 10 min en la caché del navegador y
        # main.dart.js siempre se llama igual: tras publicar, recargar seguía
        # mostrando la versión anterior. Con la versión del commit en la URL,
        # recargar trae siempre lo último.
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/\"mainJsPath\":\"main.dart.js\"/\"mainJsPath\":\"main.dart.js?v=$v\"/" build/web/flutter_bootstrap.js
          sed -i "s/src=\"flutter_bootstrap.js\"/src=\"flutter_bootstrap.js?v=$v\"/" build/web/index.html
          grep -q "main.dart.js?v=$v" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$v" build/web/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
