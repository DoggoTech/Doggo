name: APK de Android

# Al crear un tag v* (p. ej. v0.1.0) o a mano desde la pestaña Actions.
# El APK queda adjunto a un Release para instalarlo directo en Android.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Compilar el APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk doggo.apk
      - uses: softprops/action-gh-release@v2
        with:
          # Con tag: release normal. A mano: una versión de prueba numerada.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('demo-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('Doggo {0}', github.ref_name) || format('Doggo demo {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: doggo.apk
